# studioh-ai — the Worker behind every AI feature, every generated image, the plant-book
# sync and the PDF store.
#
# WHY THIS FILE EXISTS: this Worker had only ever been deployed by pasting into the
# Cloudflare dashboard, so the repo had no config. A `wrangler deploy` without one does
# NOT inherit the bindings set in the dashboard — it replaces them with nothing, and the
# KV namespace, both R2 buckets and the workers.dev route all disappear at once. Every
# value below was read off the live deployment (version b162698e, 2026-08-30) so that a
# deploy from this directory reproduces it exactly.
#
# SECRETS ARE NOT LISTED HERE and must never be: ADMIN_KEY, ANTHROPIC_API_KEY and FAL_KEY
# live on the Worker and survive a deploy. Set or rotate them with
#   npx wrangler secret put ADMIN_KEY --name studioh-ai
#
# Before deploying, confirm nothing has drifted:
#   npx wrangler deploy --dry-run        # prints the bindings it is about to apply
#   npx wrangler versions view <id> --name studioh-ai   # what is live right now

name = "studioh-ai"
main = "src/index.js"
compatibility_date = "2026-07-08"
account_id = "cca425d0e5f1d1d17d5297e810a9205c"

# The app calls https://studioh-ai.warwick-cca.workers.dev directly (AI_PROXY_URL in
# index.html). Setting this false would take that hostname down.
workers_dev = true

# Plant book, bid data and shared prefs.
[[kv_namespaces]]
binding = "PLANTS_KV"
id = "fc1f71c86e76416f8622663ed856b493"

# AI renders and re-hosted plant images. Note the bucket is `studio-images`, not
# `studioh-images` — the missing "h" is deliberate and correct.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "studio-images"

# Plan PDFs, stored as raw binary. Never base64 — it crashes the Worker.
[[r2_buckets]]
binding = "PDFS"
bucket_name = "studioh-pdfs"

# Preserve the deployed Worker's existing logging configuration.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
