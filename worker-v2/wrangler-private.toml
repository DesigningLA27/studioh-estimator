name = "studioh-v2-storage"
main = "src/index.js"
compatibility_date = "2026-09-25"
account_id = "cca425d0e5f1d1d17d5297e810a9205c"
workers_dev = true
routes = [{ pattern = "app.warwick.design", custom_domain = true }]
[assets]
directory = ".private-app"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
[[r2_buckets]]
binding = "PROJECTS"
bucket_name = "studioh-v2-private"
[[r2_buckets]]
binding = "DESIGN_LIBRARY"
bucket_name = "studio-h-library-private"
[[services]]
binding = "LEGACY"
service = "studioh-ai"
[[services]]
binding = "GOODS"
service = "studioh-goods"
[observability]
enabled = false
[vars]
ACCESS_ISSUER = "https://lively-sunset-dd9a.cloudflareaccess.com"
ACCESS_AUD = "f9875a5fba1b27b59f9558e71869e659e17b0ead7d24252e1580e2116d17e751"
PUBLIC_ACCOUNTS = "false"
APP_URL = "https://studioh-v2-storage.warwick-cca.workers.dev/app/"

[build]
command = "python3 build-current.py --deploy"
