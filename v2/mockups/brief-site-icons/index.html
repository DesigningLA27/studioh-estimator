<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio H · Brief & site icon options</title><style>*{box-sizing:border-box}body{--bg:#eaf0e3;--green:#426334;margin:0;background:#faf9f6;color:#273126;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:28px}.wrap{max-width:1140px;margin:auto}.eyebrow{font-size:10px;letter-spacing:2px;color:#66745d;font-weight:700}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}p{color:#63715b;line-height:1.5}header{margin-bottom:26px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:#e8eddf;color:#426334;padding:11px 15px}.toolbar button[aria-pressed=true]{background:var(--green);color:white}.row{margin-bottom:22px}.row h2{font-size:18px;margin:0 0 12px;letter-spacing:-.4px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.choice{background:white;display:flex;align-items:center;gap:20px;padding:16px;text-align:left;border-radius:20px;min-width:0}.choice[aria-pressed=true]{background:#dce7d2}.tile{flex-shrink:0;width:94px;height:90px;border-radius:18px;background:var(--bg);display:grid;place-items:center}.tile svg{width:58px;height:58px;fill:var(--green);stroke-linejoin:round;stroke-linecap:round}.cut{fill:var(--bg)}.line{fill:none;stroke:var(--green);stroke-width:4}.cut-line{fill:none;stroke:var(--bg);stroke-width:3}.choice small{display:block;font-size:11px;color:#6d795f;margin-bottom:7px}.choice strong{display:block;font-size:14px;line-height:1.35}.choice .selected{font-size:11px;margin-top:8px;color:#426334;display:block;min-height:14px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border-radius:22px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.card h2{font-size:17px}.card p{font-size:12px}.hint{font-size:12px}footer{font-size:12px;color:#67725f;margin-top:24px}button:focus-visible{outline:2px solid var(--green);outline-offset:3px}@media(max-width:950px){.choice{flex-direction:column;gap:12px;align-items:center;text-align:center}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){body{padding:20px 12px}.choices{gap:7px}.choice{padding:12px 6px;border-radius:16px}.tile{width:78px;height:76px;border-radius:15px}.tile svg{width:52px;height:52px}.choice strong{font-size:12px}.gallery{grid-template-columns:1fr}h1{font-size:25px}}</style></head><body><div class="wrap"><header><span class="eyebrow">STUDIO H · BRIEF & SITE · ICON OPTIONS</span><h1>Brief & site. Eighteen icon options.</h1><p>The same solid forest-green style and pale sage background throughout.<br>Select one option per card, then preview your combination.</p><div class="toolbar"><button data-view="compare" aria-pressed="true">Compare options</button><button data-view="preview" aria-pressed="false">Preview my choices</button></div><p class="hint" id="status">Selections stay in this mockup.</p></header><main></main><footer>Design study · The live app is unchanged.</footer></div><script>

le cx=\"12\" cy=\"14\" r=\"5\"/><circle cx=\"44\" cy=\"8\" r=\"5\"/><circle cx=\"54\" cy=\"37\" r=\"5\"/><circle cx=\"37\" cy=\"55\" r=\"5\"/><circle cx=\"8\" cy=\"46\" r=\"5\"/></g>"}, {"label": "Plan & ruler", "art": "<rect x=\"5\" y=\"5\" width=\"41\" height=\"41\" rx=\"5\"/><path class=\"cut-line\" d=\"M14 14h23v22H14Zm0 11h12V14\"/><rect x=\"13\" y=\"46\" width=\"47\" height=\"13\" rx=\"3\" stroke=\"var(--bg)\" stroke-width=\"3\"/><path class=\"cut-line\" d=\"M22 49v5m9-5v3m9-3v5m9-5v3\"/>"}, {"label": "Draw the outline", "art": "<path d=\"M7 9h34v8H15v31h33V35h8v21H7Z\"/><g transform=\"rotate(40 39 28)\"><rect x=\"34\" y=\"3\" width=\"12\" height=\"39\" rx=\"4\"/><path d=\"m34 45 6 10 6-10Z\"/><path class=\"cut-line\" d=\"M38 10v25\"/></g>"}]}, {"name": "Site intelligence", "choices": [{"label": "Protected property", "art": "<path d=\"M32 4 56 13v18c0 15-14 24-24 29C22 55 8 46 8 31V13Z\"/><path class=\"cut\" d=\"m18 29 14-12 14 12v17H18Z\"/><rect x=\"28\" y=\"33\" width=\"8\" height=\"13\" rx=\"1\"/>"}, {"label": "Site investigation", "art": "<path d=\"m5 12 15-5 16 5 16-5v30L36 42l-16-5-15 5Z\"/><path class=\"cut-line\" d=\"M20 13v17m16-11v12\"/><circle cx=\"43\" cy=\"40\" r=\"12\" stroke=\"var(--bg)\" stroke-width=\"3\"/><circle class=\"cut\" cx=\"43\" cy=\"40\" r=\"6\"/><path class=\"line\" d=\"m51 49 9 10\"/>"}, {"label": "Location & layers", "art": "<path d=\"m7 40 25-12 25 12-25 12Zm0 10 25 12 25-12v6L32 68 7 56Z\" transform=\"translate(0 -8)\"/><path d=\"M45 16c0 10-13 22-13 22S19 26 19 16a13 13 0 0126 0Z\" stroke=\"var(--bg)\" stroke-width=\"3\"/><circle class=\"cut\" cx=\"32\" cy=\"16\" r=\"4\"/>"}]}, {"name": "Photos & references", "choices": [{"label": "Photo collection", "art": "<rect x=\"5\" y=\"8\" width=\"42\" height=\"35\" rx=\"5\" transform=\"rotate(-10 26 25)\"/><rect x=\"15\" y=\"20\" width=\"44\" height=\"36\" rx=\"5\" stroke=\"var(--bg)\" stroke-width=\"3\"/><circle class=\"cut\" cx=\"46\" cy=\"30\" r=\"4\"/><path class=\"cut\" d=\"m21 48 11-15 8 10 5-5 8 10Z\"/>"}, {"label": "Site camera", "art": "<path d=\"M7 16h12l5-8h16l5 8h12v38H7Z\"/><circle class=\"cut\" cx=\"32\" cy=\"35\" r=\"13\"/><circle cx=\"32\" cy=\"35\" r=\"8\"/><rect class=\"cut\" x=\"46\" y=\"21\" width=\"6\" height=\"4\" rx=\"1\"/>"}, {"label": "Reference board", "art": "<rect x=\"6\" y=\"7\" width=\"23\" height=\"28\" rx=\"4\"/><rect x=\"34\" y=\"7\" width=\"24\" height=\"17\" rx=\"4\"/><rect x=\"34\" y=\"29\" width=\"24\" height=\"28\" rx=\"4\"/><rect x=\"6\" y=\"40\" width=\"23\" height=\"17\" rx=\"4\"/><path class=\"cut\" d=\"m10 29 7-12 8 12Zm28 22 6-12 5 6 4-5v11Z\"/>"}]}, {"name": "Site studies", "choices": [{"label": "Sun & shade", "art": "<circle cx=\"23\" cy=\"22\" r=\"10\"/><path class=\"line\" d=\"M23 5V2m0 40v-3M6 22H3m40 0h-3M11 10 8 7m27 3 3-3M11 34l-3 3\"/><path d=\"M29 35h10l20 22H9Z\"/><path class=\"cut\" d=\"m39 38 16 17H39Z\"/>"}, {"label": "Site orientation", "art": "<circle cx=\"32\" cy=\"32\" r=\"25\"/><circle class=\"cut\" cx=\"32\" cy=\"32\" r=\"19\"/><path d=\"m43 17-7 20-15 10 7-20Z\"/><path class=\"cut\" d=\"m32 32 11-15-7 20Z\"/><path class=\"line\" d=\"M32 8v5m0 38v5M8 32h5m38 0h5\"/>"}, {"label": "Terrain study", "art": "<rect x=\"6\" y=\"7\" width=\"52\" height=\"50\" rx=\"6\"/><path class=\"cut-line\" d=\"M12 19c10-12 28 0 40-6M12 29c14-16 25 2 40-4M12 40c14-16 28 0 40-4M12 50c18-14 26 2 40-4\"/>"}]}];let selected={};try{selected=JSON.parse(localStorage.getItem('studioh_brief_icon_choices_v1')||'{}')}catch{}let view='compare';
function tile(c){return `<span class="tile"><svg viewBox="0 0 64 64" aria-hidden="true">${c.art}</svg></span>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.querySelector('#status').textContent=Object.keys(selected).length+' of 6 selected · Selections stay in this mockup.';document.querySelector('main').innerHTML=view==='compare'?groups.map((g,i)=>`<section class="row"><h2>${g.name}</h2><div class="choices">${g.choices.map((c,j)=>`<button class="choice" data-group="${i}" data-choice="${j}" aria-pressed="${selected[i]===j}">${tile(c)}<span><small>OPTION 0${j+1}</small><strong>${c.label}</strong><span class="selected">${selected[i]===j?'✓ Selected':''}</span></span></button>`).join('')}</div></section>`).join(''):`<div class="gallery">${groups.map((g,i)=>{const c=g.choices[selected[i]??0];return `<article class="card"><div><h2>${g.name}</h2><p>${c.label}${selected[i]==null?' · Preview default':''}</p></div>${tile(c)}</article>`}).join('')}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)view=b.dataset.view;else if(b.dataset.group!=null){selected[b.dataset.group]=Number(b.dataset.choice);try{localStorage.setItem('studioh_brief_icon_choices_v1',JSON.stringify(selected))}catch{}}render()});render();
</script></body></html>
