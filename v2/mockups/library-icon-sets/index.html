<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio H · Library icon sets</title><style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#faf9f6;color:#273126;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:1180px;margin:auto}header{margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:2px;color:#64735c;font-weight:700}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}p{color:#67715f;line-height:1.5}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button{border:0;border-radius:12px;padding:12px 16px;background:#e9eee2;color:#415837;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#4f713d;color:white}button:focus-visible{outline:2px solid #4f713d;outline-offset:3px}.matrix{display:grid;gap:8px}.row{display:grid;grid-template-columns:210px repeat(3,minmax(0,1fr));align-items:center;gap:12px;border-radius:18px;padding:10px 16px;background:white}.row.header{background:none;padding-bottom:12px;position:sticky;top:0;z-index:2;background:#faf9f6}.row.header strong{display:block;font-size:15px;margin-bottom:5px}.row.header small{font-size:12px;color:#64735c}.label{font-weight:650;font-size:14px}.cell{display:flex;justify-content:center;align-items:center}.tile{background:#eaf0e3;border-radius:18px;width:88px;height:80px;display:grid;place-items:center}.tile svg{width:43px;height:43px;overflow:visible;stroke-linecap:round;stroke-linejoin:round}.outline .shape{fill:#eaf0e3;stroke:#426334;stroke-width:1.5}.outline .detail{fill:none;stroke:#426334;stroke-width:1.5}.outline .dot{fill:#426334;stroke:none}.tone .shape{fill:#bfd0b0;stroke:#426334;stroke-width:1.4}.tone .detail{fill:none;stroke:#426334;stroke-width:1.4}.tone .dot{fill:#426334;stroke:none}.solid .shape{fill:#426334;stroke:#426334;stroke-width:1.7}.solid .detail{fill:none;stroke:#eaf0e3;stroke-width:1.7}.solid .dot{fill:#eaf0e3;stroke:none}.solid .outside{stroke:#426334}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border-radius:22px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:16px}.card h2{font-size:17px;letter-spacing:-.4px;margin:8px 0 10px}.card p{font-size:13px;margin:0}.open{grid-column:1/-1;justify-self:start;background:#f7f6f2;padding:11px 14px;border-radius:12px;font-size:13px}.gallery-title{margin:26px 0 20px}footer{font-size:12px;color:#687360;margin-top:24px}.recommended{font-size:10px;border-radius:6px;padding:4px 6px;background:#e7eddf;color:#4c673d;margin-left:5px}@media(max-width:800px){body{padding:20px 12px}.row{grid-template-columns:135px repeat(3,minmax(0,1fr));gap:8px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.row.header strong{font-size:12px}.row.header small{font-size:10px}.recommended{display:none}}@media(max-width:520px){.row{grid-template-columns:94px repeat(3,minmax(0,1fr));padding:8px;gap:5px}.tile{width:60px;height:62px;border-radius:14px}.tile svg{width:35px;height:35px}.label{font-size:12px}.row.header small{display:none}.gallery{grid-template-columns:1fr}.card{grid-template-columns:minmax(0,1fr) 74px}.card .tile{width:74px;height:74px}h1{font-size:26px}nav button{padding:10px 12px;font-size:12px}}
</style></head><body><div class="wrap"><header><span class="eyebrow">STUDIO H · LIBRARY ICON STUDY</span><h1>One family. Three directions.</h1><p>Every icon uses the same pale sage background, forest green, rounded frame and optical size.<br>Compare all three options, or see one complete set in the library cards.</p><nav aria-label="Icon set preview"><button data-set="compare" aria-pressed="true">Compare all 33</button><button data-set="outline" aria-pressed="false">01 · Fine outline</button><button data-set="tone" aria-pressed="false">02 · Soft two-tone</button><button data-set="solid" aria-pressed="false">03 · Solid</button></nav></header><main></main><footer>Design mockup · The live app is unchanged.</footer></div><script>
const items=[
['Plant Book','Plants, favorites and growing requirements.','<path class="shape" d="M16 3C10 6 7 11 7 16a9 9 0 0018 0c0-5-3-10-9-13Z"/><path class="detail" d="M16 12v12m0-6-4-3m4 6 5-5"/><path class="detail outside" d="M16 25v4"/>'],
['Price Book','Rates, assemblies, labor and bid feedback.','<rect class="shape" x="6" y="3" width="21" height="26" rx="4"/><path class="detail" d="M10 4v24m7-9c0 2 6 2 6-1 0-4-6-1-6-5 0-3 6-3 6-1m-3-3v14"/>'],
['Materials','Finishes, sizes, suppliers and sourced prices.','<rect class="shape" x="5" y="4" width="16" height="22" rx="3" transform="rotate(-14 13 15)"/><rect class="shape" x="11" y="8" width="16" height="21" rx="3"/><path class="detail" d="M15 14h8m-8 5h8m-8 5h4"/>'],
['Furnishings','Furniture, dimensions and supplier links.','<rect class="shape" x="8" y="5" width="16" height="16" rx="4"/><path class="shape" d="M5 15a3 3 0 013 3v2h16v-2a3 3 0 016 0v7H2v-7a3 3 0 013-3Z"/><path class="detail" d="M8 20h16"/><path class="detail outside" d="M6 25v4m20-4v4"/>'],
['Products','Lighting, equipment and specified products.','<rect class="shape" x="12" y="3" width="8" height="26" rx="3"/><rect class="detail" x="14" y="6" width="4" height="7" rx="1"/><path class="detail outside" d="M6 7H3m3 5H2m24-5h3m-3 5h4"/>'],
['Color Library','Saved palettes and manufacturer colors.','<rect class="shape" x="7" y="3" width="10" height="26" rx="4" transform="rotate(-30 12 24)"/><rect class="shape" x="10" y="3" width="10" height="26" rx="4" transform="rotate(0 15 24)"/><rect class="shape" x="13" y="3" width="10" height="26" rx="4" transform="rotate(30 18 24)"/><path class="detail" d="m22 9 6 3m-9 3 6 3"/><circle class="dot" cx="17" cy="25" r="1.3"/>'],
['HOA & DRC','Association guidelines, sources and contacts.','<path class="shape" d="M16 3 27 7v10c0 6-6 10-11 12C11 27 5 23 5 17V7Z"/><path class="detail" d="m10 15 6-5 6 5m-10-1v8h8v-8m-6 8v-5h4v5"/>'],
['City Library','City documents, setbacks and source history.','<rect class="shape" x="4" y="12" width="10" height="17" rx="2"/><rect class="shape" x="15" y="4" width="13" height="25" rx="2"/><path class="detail" d="M8 17h2m-2 5h2m10-12h3m-3 6h3m-3 6h3"/>'],
['Nurseries','Suppliers, stock and availability.','<path class="shape" d="M8 19h16l-2 10H10Z"/><path class="shape" d="M16 17C7 18 5 12 6 7c7 0 11 4 10 10Zm0-4c0-7 5-10 11-9 0 7-4 11-11 9Z"/><path class="detail outside" d="M16 19v-6"/>'],
['CAD & specifications','Details and specification references.','<rect class="shape" x="4" y="4" width="24" height="24" rx="3"/><path class="detail" d="M10 9h12v14H10Zm0 8h7V9m0 8h5M7 4v3m18 18h3M4 25h3"/>'],
['Product Watch','Review price and availability updates.','<rect class="shape" x="3" y="4" width="23" height="22" rx="4"/><path class="detail" d="m7 18 5-5 5 3 5-6"/><circle class="shape" cx="24" cy="24" r="6"/><path class="detail" d="M24 21v3l2 1"/>']];
const labels={outline:['01 · Fine outline','Light and precise'],tone:['02 · Soft two-tone','Soft fill, clear edges'],solid:['03 · Solid','Bold and compact']};
function icon(shapes,set){return `<div class="tile ${set}"><svg viewBox="0 0 32 32" aria-hidden="true">${shapes}</svg></div>`}
function render(set){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===set));const main=document.querySelector('main');main.innerHTML=set==='compare'?`<div class="matrix"><div class="row header"><div class="eyebrow">LIBRARY</div>${Object.entries(labels).map(([k,[title,desc]])=>`<div style="text-align:center"><strong>${title}</strong><small>${desc}</small></div>`).join('')}</div>${items.map(([title,desc,shapes])=>`<div class="row"><div class="label">${title}</div>${Object.keys(labels).map(k=>`<div class="cell" aria-label="${title}: ${labels[k][0]}">${icon(shapes,k)}</div>`).join('')}</div>`).join('')}</div>`:`<h2 class="gallery-title">${labels[set][0]}</h2><div class="gallery">${items.map(([title,desc,shapes])=>`<article class="card"><div><h2>${title}</h2><p>${desc}</p></div>${icon(shapes,set)}<span class="open">Open library →</span></article>`).join('')}</div>`}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-set]');if(b)render(b.dataset.set)};render('compare');
</script></body></html>
