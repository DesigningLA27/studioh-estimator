<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio H · Project picker options</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,sans-serif;background:#e9ede5;color:#273127}button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 18px;background:#edf2e8;color:inherit;cursor:pointer}button.on,.primary{background:#50793e;color:white}header{padding:22px 32px;background:white;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header strong{font-size:18px}header p{margin:4px 0;color:#63705c}nav{display:flex;gap:8px;flex-wrap:wrap}.stage{min-height:80vh;padding:50px 24px;display:grid;place-items:center;background:linear-gradient(#46553c66,#46553c66)}.modal{width:min(800px,100%);background:#faf9f6;padding:32px;border-radius:26px;box-shadow:0 28px 80px #18251440}.head{display:flex;justify-content:space-between;align-items:start;gap:20px}h1{font-size:28px;line-height:1.2;margin:0 0 10px}h2{font-size:18px;margin:0 0 8px}p{margin:0;color:#66705f}.eyebrow{font-size:11px;letter-spacing:.15em;margin-bottom:12px;display:block}.search{width:100%;border:0;border-radius:12px;background:white;padding:15px;margin:24px 0}.row{display:flex;align-items:center;gap:20px;padding:20px;background:white;border-radius:18px;margin:12px 0}.row>div{flex:1}.row small{display:block;color:#66705f;margin-top:6px}.badge{display:inline-block;background:#eaf1e5;border-radius:20px;padding:4px 10px;font-size:11px;margin-left:8px}.bottom{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:26px;border-top:1px solid #e2e5dc;padding-top:22px}.bottom p{font-size:12px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.tile{background:white;border-radius:18px;overflow:hidden}.tile .info{padding:22px}.tile svg{width:100%;height:190px;display:block}.tile button{margin-top:20px}.import{border:1px dashed #a7b69c;border-radius:18px;padding:22px;margin-top:18px}.compact{max-width:620px}.notice{margin-top:14px;color:#50793e}.selected{outline:2px solid #50793e}.modal[data-theme=Night]{background:#161b24;color:#eaedf3}.modal[data-theme=Night] .row,.modal[data-theme=Night] .tile,.modal[data-theme=Night] input{background:#242c37;color:#eaedf3}.modal[data-theme=Night] p,.modal[data-theme=Night] small{color:#aeb9c6}.modal[data-theme=Night] button{background:#30422c;color:#dbe8d1} @media(max-width:620px){.modal{padding:22px}.tiles{grid-template-columns:1fr}.row{gap:10px;flex-wrap:wrap}.stage{padding:24px 12px}}
</style><header><div><strong>Project picker · three options</strong><p>Design study · sample labels · no projects are opened or changed.</p></div><nav><button class="on" data-option="1">01 · Clear list</button><button data-option="2">02 · Visual cards</button><button data-option="3">03 · Focused chooser</button><button id="theme">Night preview</button></nav></header><main class="stage"><section class="modal" role="dialog" aria-labelledby="title"></section></main><script>
const m=document.querySelector('.modal');let option=1,night=false;const thumb=`<svg viewBox="105 240 710 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Reference image of saved satellite trace"><image href="../project-identity/assets/tracer-reference.jpg" width="1280" height="960"/></svg>`;const row=(name,sub)=>`<article class="row"><div><strong>${name}</strong><small>${sub}</small></div><button data-select="${name}">Open →</button></article>`;function draw(){m.className='modal '+(option===3?'compact':'');m.dataset.theme=night?'Night':'Morning';m.innerHTML=`<div class="head"><div><span class="eyebrow">STUDIO H · YOUR PROJECTS</span><h1 id="title">${option===3?'Which project?':'Open a project'}</h1><p>${option===2?'Recognize your project at a glance.':'Continue a saved project or bring in a project file.'}</p></div><button aria-label="Close preview" data-dismiss>×</button></div>`+(option===1?`<input class="search" placeholder="Search your saved projects" aria-label="Search projects"><small>SAVED IN CLOUDFLARE</small>${row('SAMPLE DEMO','Satellite trace · 16 saved shapes')}${row('Nest Pine','CAD project · saved drawing')}<div class="import"><h2>Import a project file</h2><p>Restore a Studio H project backup (.json).</p><button data-import style="margin-top:16px">Choose project file</button></div>`:option===2?`<div class="tiles"><article class="tile">${thumb}<div class="info"><h2>SAMPLE DEMO</h2><p>Satellite trace · 16 saved shapes</p><button class="primary" data-select="SAMPLE DEMO">Open project →</button></div></article><article class="tile"><div style="height:190px;background:#eaf1e5;display:grid;place-items:center;color:#50793e;font-size:28px">CAD drawing</div><div class="info"><h2>Nest Pine</h2><p>Saved plan and take-off</p><button data-select="Nest Pine">Open project →</button></div></article></div>`:`<div style="margin-top:24px">${row('SAMPLE DEMO','Open the actual saved satellite project')}${row('Browse all projects','Find a saved project in Cloudflare')}${row('Import a project file','Restore a Studio H backup (.json)')}</div>`)+`<footer class="bottom"><p>Your V1 original stays unchanged.<br>Work opens as a V2 copy.</p>${option!==1?'<button data-import>Import project file</button>':'<button data-select="All projects">Refresh project list</button>'}</footer><p class="notice" role="status"></p>`;m.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{m.querySelector('.notice').textContent='Preview: '+b.dataset.select+' would open here.'});m.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>m.querySelector('.notice').textContent='Preview: the file chooser would open for a Studio H JSON backup.');m.querySelector('[data-dismiss]').onclick=()=>m.querySelector('.notice').textContent='This is the popup design preview. Choose another option above.';m.querySelector('.search')?.addEventListener('input',e=>m.querySelectorAll('.row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(e.target.value.toLowerCase())))}document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{option=+b.dataset.option;document.querySelectorAll('[data-option]').forEach(x=>x.classList.toggle('on',x===b));draw()});document.querySelector('#theme').onclick=()=>{night=!night;draw()};draw();</script></html>
