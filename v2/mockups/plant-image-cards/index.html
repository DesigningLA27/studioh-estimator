<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio H · Plant photo cards</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#faf9f6;color:#263026;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{max-width:1160px;margin:0 auto 30px}small.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#64725e}h1{font-size:30px;letter-spacing:-1px;margin:10px 0}p{color:#65705e;line-height:1.5}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:#ecefe7;color:#32462d;padding:11px 16px}nav button[aria-pressed=true]{background:#4f783d;color:white}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;max-width:1160px;margin:auto}.option h2{font-size:18px;margin:0 0 8px}.intro{min-height:44px;margin:0 0 18px;font-size:13px}.sidebar{background:#eaf0e3;border-radius:24px;padding:14px;max-width:340px;margin:auto}.toolbar{display:flex;gap:5px;align-items:center;margin-bottom:16px}.toolbar span{display:grid;place-items:center;height:36px;width:36px;background:#fff;border-radius:12px;font-size:19px}.toolbar .spacer{flex:1;background:none}.photo-card{border-radius:20px;background:white;padding:16px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.photo{display:block;width:220px;height:220px;max-width:100%;object-fit:contain;border-radius:18px}.info{padding:18px;background:white;border-radius:20px}.info h3{font-size:21px;letter-spacing:-.7px;margin:0 0 3px}.botanical{font-style:italic;font-size:13px}.tabs{display:flex;background:#f7f6f2;padding:4px;border-radius:13px;margin:22px 0}.tabs span{width:50%;padding:9px;text-align:center;color:#67715f}.tabs .active{border-radius:10px;background:#4f783d;color:white}.traits{display:flex;justify-content:space-between;gap:8px;margin:20px 0}.traits small{font-size:11px;display:block;margin-bottom:10px}.traits strong{font-size:13px}.pill{display:inline-block;background:#e8efdf;color:#476036;padding:6px 9px;font-size:11px;border-radius:9px}.source{font-size:12px;margin:18px 0 0}.next{background:white;border-radius:20px;padding:18px;margin-top:12px}.next strong{font-size:11px;letter-spacing:1px;color:#63705d}.data{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}.unified{background:white;border-radius:20px;overflow:hidden;padding-top:16px}.unified .photo-card{padding:0 16px 2px;margin:0}.unified .info{padding-top:18px}.tonal .photo-card{background:#d4dfc9;padding:22px 16px}.tag{display:inline-block;background:#e4eddb;color:#4d683c;font-size:10px;padding:4px 7px;border-radius:7px;vertical-align:middle;margin-left:6px;letter-spacing:0}.options.single{grid-template-columns:1fr;max-width:400px}.options.single .option{display:none}.options.single .option.chosen{display:block}.options.single .intro{min-height:0}footer{max-width:1160px;margin:26px auto;color:#64725e;font-size:12px}@media(max-width:1000px){body{padding:24px 16px}.options{gap:14px}.sidebar{padding:10px}.info{padding:14px}.photo{height:auto;aspect-ratio:1}.traits{gap:4px}.traits strong{font-size:11px}.option h2{font-size:16px}}@media(max-width:730px){.options{grid-template-columns:1fr}.option{max-width:380px;width:100%;margin:0 auto 20px}.intro{min-height:0}.photo{width:220px;height:220px}.info{padding:18px}.traits strong{font-size:13px}}
</style></head><body><header><small class="eyebrow">STUDIO H · PLANT BOOK</small><h1>A home for the plant photo.</h1><p>Three treatments for the right sidebar. Same photo, same information, different card backgrounds.</p><nav aria-label="Compare photo card options"><button data-view="all" aria-pressed="true">Compare all</button><button data-view="1" aria-pressed="false">01 · White frame</button><button data-view="2" aria-pressed="false">02 · One card</button><button data-view="3" aria-pressed="false">03 · Sage frame</button></nav></header><main class="options"></main><footer>Layout study · No changes to the live Plant Book.</footer><script>
const photo='<img class="photo" src="https://studioh-ai.warwick-cca.workers.dev/?imgget=tree_tr_qagri_mro0eq0v" alt="Coast live oak in a garden">';
const info='<div class="info"><h3>Coast Live Oak</h3><div class="botanical">Quercus agrifolia</div><div class="tabs" aria-label="Read mode preview"><span class="active">Read</span><span>Edit</span></div><div class="traits"><div><small>Water</small><strong>Very low</strong></div><div><small>Sun</small><strong>Full sun</strong></div><div><small>Growth</small><strong>Slow</strong></div></div><span class="pill">Toxicity: Mild</span><p class="source">Shared library record · AI image</p></div>';
const toolbar='<div class="toolbar" aria-hidden="true"><span>‹</span><span>›</span><span class="spacer"></span><span>★</span><span>⤢</span><span>×</span></div>';
const next='<div class="next"><strong>SIZE & SPACING</strong><div class="data"><span>Mature width</span><b>50 ft</b></div><div class="data"><span>Mature height</span><b>50 ft</b></div></div>';
const options=[['White frame','A separate white card gives the photo breathing room.',''],['One card','Photo and plant details belong to one continuous card.','unified'],['Sage frame','A deeper sage background adds gentle contrast.','tonal']];
document.querySelector('main').innerHTML=options.map(([title,desc,type],i)=>`<section class="option" data-option="${i+1}"><h2>0${i+1} · ${title}${i===1?'<span class="tag">Recommended</span>':''}</h2><p class="intro">${desc}</p><div class="sidebar ${type==='tonal'?'tonal':''}">${toolbar}${type==='unified'?'<div class="unified">':''}<div class="photo-card">${photo}</div>${info}${type==='unified'?'</div>':''}${next}</div></section>`).join('');
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;const v=b.dataset.view;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('main').classList.toggle('single',v!=='all');document.querySelectorAll('.option').forEach(x=>x.classList.toggle('chosen',x.dataset.option===v))};
</script></body></html>
