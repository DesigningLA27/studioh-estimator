<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio H · Programming icon options</title><style>*{box-sizing:border-box}body{--bg:#eaf0e3;--green:#426334;margin:0;background:#faf9f6;color:#273126;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:28px}.wrap{max-width:1140px;margin:auto}.eyebrow{font-size:10px;letter-spacing:2px;color:#66745d;font-weight:700}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}p{color:#63715b;line-height:1.5}header{margin-bottom:26px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:#e8eddf;color:#426334;padding:11px 15px}.toolbar button[aria-pressed=true]{background:var(--green);color:white}.row{margin-bottom:22px}.row h2{font-size:18px;margin:0 0 12px;letter-spacing:-.4px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.choice{background:white;display:flex;align-items:center;gap:20px;padding:16px;text-align:left;border-radius:20px;min-width:0}.choice[aria-pressed=true]{background:#dce7d2}.tile{flex-shrink:0;width:94px;height:90px;border-radius:18px;background:var(--bg);display:grid;place-items:center}.tile svg{width:58px;height:58px;fill:var(--green);stroke-linejoin:round;stroke-linecap:round}.cut{fill:var(--bg)}.line{fill:none;stroke:var(--green);stroke-width:4}.cut-line{fill:none;stroke:var(--bg);stroke-width:3}.choice small{display:block;font-size:11px;color:#6d795f;margin-bottom:7px}.choice strong{display:block;font-size:14px;line-height:1.35}.choice .selected{font-size:11px;margin-top:8px;color:#426334;display:block;min-height:14px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border-radius:22px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.card h2{font-size:17px}.card p{font-size:12px}.hint{font-size:12px}footer{font-size:12px;color:#67725f;margin-top:24px}button:focus-visible{outline:2px solid var(--green);outline-offset:3px}@media(max-width:950px){.choice{flex-direction:column;gap:12px;align-items:center;text-align:center}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){body{padding:20px 12px}.choices{gap:7px}.choice{padding:12px 6px;border-radius:16px}.tile{width:78px;height:76px;border-radius:15px}.tile svg{width:52px;height:52px}.choice strong{font-size:12px}.gallery{grid-template-columns:1fr}h1{font-size:25px}}.approved{margin:26px 0 34px}.approved>h2{font-size:16px}.approved-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.approved-card{padding:14px;background:white;border-radius:18px;display:flex;align-items:center;gap:12px}.approved-card .tile{width:58px;height:58px;border-radius:13px}.approved-card svg{width:40px;height:40px}.approved-card strong{font-size:13px}.approved-card small{display:block;font-size:11px;color:#64755c;margin-top:6px}@media(max-width:850px){.approved-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.approved-card{padding:10px;gap:8px}.approved-card .tile{width:46px;height:48px}.approved-card svg{width:34px;height:34px}.approved-card strong{font-size:12px}}
</style></head><body><div class="wrap"><header><span class="eyebrow">STUDIO H · PROGRAMMING · DESIGN STUDY</span><h1>A clearer way to start.</h1><p>Three options for each source. Solid forest green, the same sage background, and rounded tiles throughout.</p><div class="toolbar"><button data-view="compare" aria-pressed="true">Compare options</button><button data-view="preview" aria-pressed="false">Preview my choices</button></div><p class="hint" id="status"></p></header><main></main><footer>Mockup only · Select one per row, then preview them together. Your live app is unchanged.</footer></div><script>const groups=[{"name": "PDF plan", "choices": [{"label": "Drawing sheet", "art": "<path d=\"M14 5h25l12 12v38a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4Z\"/><path class=\"cut\" d=\"M38 5v14h14\"/><path class=\"cut-line\" d=\"M20 29h23v20H20Zm0 10h13V29m0 10v10\"/>"}, {"label": "Rolled site plan", "art": "<path d=\"M12 12h38v40H12Z\"/><rect x=\"5\" y=\"7\" width=\"12\" height=\"50\" rx=\"6\"/><rect x=\"47\" y=\"7\" width=\"12\" height=\"50\" rx=\"6\"/><path class=\"cut-line\" d=\"m25 22 15 3-3 18-15-4Z M29 25l-2 11 8 3\"/>"}, {"label": "Plan & ruler", "art": "<rect x=\"9\" y=\"5\" width=\"38\" height=\"46\" rx=\"5\"/><path class=\"cut-line\" d=\"M18 15h20v23H18Zm0 11h10V15\"/><rect x=\"15\" y=\"45\" width=\"44\" height=\"13\" rx=\"3\" stroke=\"var(--bg)\" stroke-width=\"3\"/><path class=\"cut-line\" d=\"M24 47v4m8-4v7m8-7v4m8-4v7\"/>"}]}, {"name": "Property map", "choices": [{"label": "Map & location pin", "art": "<path d=\"m5 18 17-5 19 5 18-5v37l-18 5-19-5-17 5Z\"/><path class=\"cut-line\" d=\"M22 17v30m19-24v28\"/><path d=\"M32 3c-9 0-15 6-15 14 0 10 15 23 15 23s15-13 15-23C47 9 41 3 32 3Z\" stroke=\"var(--bg)\" stroke-width=\"3\"/><circle class=\"cut\" cx=\"32\" cy=\"17\" r=\"5\"/>"}, {"label": "Property boundary", "art": "<path d=\"m9 15 37-7 10 37-38 12Z\"/><path class=\"cut-line\" d=\"m14 20 28-6 8 28-29 9Z\"/><path class=\"cut\" d=\"m23 29 9-8 11 7-1 12-17 3Z\"/><path d=\"m31 34 5-1 1 9-5 1Z\"/>"}, {"label": "Satellite view", "art": "<path d=\"m5 22 26-12 28 12-27 13Z\"/><path d=\"m5 32 8-4 19 9 19-9 8 4-27 13Z M5 42l8-4 19 9 19-9 8 4-27 13Z\"/><path class=\"cut\" d=\"m22 21 9-5 11 5-10 5Z\"/>"}]}, {"name": "CAD drawing", "choices": [{"label": "Drafting triangle", "art": "<path fill-rule=\"evenodd\" d=\"M9 8a3 3 0 0 1 5-2l44 47a3 3 0 0 1-2 5H9Zm10 23v17h17Z\"/><path class=\"cut-line\" d=\"M12 19h4m-4 9h4m-4 9h4m10 16v-4m10 4v-4m10 4v-4\"/>"}, {"label": "Editable geometry", "art": "<path d=\"m14 14 34 5-7 33-29-9Z\"/><path class=\"cut-line\" d=\"m20 21 20 4-5 20-16-6Z\"/><g stroke=\"var(--bg)\" stroke-width=\"3\"><rect x=\"7\" y=\"7\" width=\"13\" height=\"13\" rx=\"3\"/><rect x=\"42\" y=\"12\" width=\"13\" height=\"13\" rx=\"3\"/><rect x=\"35\" y=\"46\" width=\"13\" height=\"13\" rx=\"3\"/><rect x=\"5\" y=\"37\" width=\"13\" height=\"13\" rx=\"3\"/></g>"}, {"label": "CAD layers & pencil", "art": "<path d=\"m5 19 23-12 25 12-25 12Z M5 29l8-4 15 8 14-7 8 5-22 11Z M5 39l8-4 15 9 9-5 5 6-14 9Z\"/><path d=\"m34 48 15-28 9 5-15 28-11 6Z\" stroke=\"var(--bg)\" stroke-width=\"3\"/><path class=\"cut-line\" d=\"m48 25 5 3\"/>"}]}];let selected={};try{selected=JSON.parse(localStorage.getItem('studioh_programming_icon_choices')||'{}')}catch{}let view='compare';
function tile(c){return `<span class="tile"><svg viewBox="0 0 64 64" aria-hidden="true">${c.art}</svg></span>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.querySelector('#status').textContent=Object.keys(selected).length+' of 3 icons selected · Selections stay in this mockup.';document.querySelector('main').innerHTML=view==='compare'?groups.map((g,i)=>`<section class="row"><h2>${g.name}</h2><div class="choices">${g.choices.map((c,j)=>`<button class="choice" data-group="${i}" data-choice="${j}" aria-pressed="${selected[i]===j}">${tile(c)}<span><small>OPTION 0${j+1}</small><strong>${c.label}</strong><span class="selected">${selected[i]===j?'✓ Selected':''}</span></span></button>`).join('')}</div></section>`).join(''):`<div class="gallery">${groups.map((g,i)=>{const c=g.choices[selected[i]??0];return `<article class="card"><div><h2>${g.name}</h2><p>${c.label}${selected[i]==null?' · Preview default':''}</p></div>${tile(c)}</article>`}).join('')}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)view=b.dataset.view;else if(b.dataset.group!=null){selected[b.dataset.group]=Number(b.dataset.choice);try{localStorage.setItem('studioh_programming_icon_choices',JSON.stringify(selected))}catch{}}render()});render();
</script></body></html>
