-overlay';canvas.style.cssText=`position:fixed;width:${137.5*size}px;height:${137.5*size}px;left:${rect.left+rect.width/2}px;top:${rect.top+rect.height/2}px;transform:translate(-50%,-50%);pointer-events:none;z-index:9999`;document.body.appendChild(canvas);const ctx=canvas.getContext('2d');const start=performance.now()+delay;function draw(now){if(!canvas.isConnected)return;if(!dot.isConnected){canvas.remove();return}const anchor=dot.getBoundingClientRect();canvas.style.left=(anchor.left+anchor.width/2)+'px';canvas.style.top=(anchor.top+anchor.height/2)+'px';const t=(now-start)/1500;if(t<0){requestAnimationFrame(draw);return}if(t>=1){canvas.remove();return}ctx.clearRect(0,0,440,440);ctx.save();ctx.translate(220,220);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=5;const radius=175*(1-Math.pow(1-t,2));for(let i=0;i<80;i++){const angle=i/80*Math.PI*2;const scale=1;const head=radius*scale;const tail=Math.max(0,head-(18+radius*.38));ctx.globalAlpha=Math.min(1,t*12)*Math.pow(1-t,.65);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(Math.cos(angle)*tail,Math.sin(angle)*tail);ctx.lineTo(Math.cos(angle)*head,Math.sin(angle)*head);ctx.stroke();for(let j=0;j<6;j++){const r=tail+(head-tail)*j/5;ctx.globalAlpha=Math.min(1,t*12)*Math.pow(1-t,.65)*(.3+.7*Math.abs(Math.sin(j*7+t*35)));ctx.beginPath();ctx.arc(Math.cos(angle)*r,Math.sin(angle)*r,j===5?1.7:1,0,Math.PI*2);ctx.fill()}}ctx.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw)}burst(1,getComputedStyle(dot).getPropertyValue('--card-purple-strong').trim()||'#AA94CF',0);burst(.5,'#F06464',0);burst(.75,getComputedStyle(dot).getPropertyValue('--card-white').trim()||'#FFFFFF',0)}


const phaseNames=['Consultation','Programming & Site Analysis','Schematic Design','Design Development','Construction Documents','Bidding / Negotiation','Construction Observation','Closeout'];const outputs=[['Proposal','Agreement'],['Base plan','Area schedule','Preliminary estimate'],['Concept layout','Planting palette','Concept presentation'],['Refined layout','Materials','Design review'],['Layout & dimensions','Planting plan','Lighting plan','Issue set'],['Bid package','Bid comparison'],['Site review','Punch list'],['Maintenance plan','Project archive']];
let layout=['a','b','c'].includes(location.hash.slice(1))?location.hash.slice(1):'b',scope=2,expanded=true,raf=0,observer=null;const decks=[['images','materials','furniture'],['next','effort','decisions']],positions=[0,0];const labels={images:'Project images',materials:'Material palette',furniture:'Furniture reference',next:'Next action',effort:'Hours & effort',decisions:'Client decisions',progress:'Task progress',milestone:'Next milestone'};const main=document.querySelector('#content');
const garden=()=>`<svg viewBox="386 514 380 507" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Project garden image"><image href="https://app.warwick.design/app/assets/asian-scenes.png" width="1536" height="1024"/></svg>`;const photo=id=>id==='images'?garden():`<img src="https://app.warwick.design/app/assets/${id==='materials'?'med-materials.png':'lounge-chair.png'}" alt="${labels[id]}">`;
function dataset(){const ids=scope===1?[4]:scope===2?[2,4]:[0,1,2,3,4,5,6,7];const current=ids.includes(4)?4:ids.at(-1);const phases=ids.map(i=>({id:i,title:phaseNames[i],items:outputs[i].map((t,j)=>({id:i+'-'+j,title:t,phase:i,total:5+j,done:i<current?5+j:i===current?(j===0?5:1):0}))}));const items=phases.flatMap(p=>p.items),active=items.find(x=>x.phase===current&&x.done<x.total)||items.at(-1);return {phases,items,current,active,total:items.reduce((s,x)=>s+x.total,0),done:items.reduce((s,x)=>s+x.done,0)}}
function slide(id){const d=dataset();if(id==='images')return `<div class="deck-slide image-slide"><div class="collage"><button class="garden" data-image="images">${garden()}</button><button data-image="materials">${photo('materials')}</button><button data-image="furniture">${photo('furniture')}</button></div></div>`;if(['materials','furniture'].includes(id))return `<button class="deck-slide photo-only" data-image="${id}">${photo(id)}</button>`;const copy={next:['THE NEXT MOVE','Clear the palette.<br>Keep the issue moving.','Confirm the material palette before the coordinated issue set.','Maya · Client decision'],effort:['HOURS & EFFORT','Keep the work<br>within the plan.','Recorded hours and the project allowance. Review remaining effort before forecasting.','152 <small>/ 180 h planned</small>'],decisions:['CLIENT DECISIONS','Two decisions<br>need a response.','Material palette and lighting selection are awaiting review.','2 <small>awaiting review</small>'],progress:['PROJECT PROGRESS','See what’s<br>already complete.','Applicable task completion from the selected sample scope.',`${d.done} <small>/ ${d.total} tasks</small>`],milestone:['NEXT MILESTONE','Coordinated<br>drawing issue.','A saved target date, not an AI-predicted completion date.','Oct 26 <small>· target</small>']}[id];return `<article class="deck-slide ${id==='effort'?'lime':id==='decisions'?'purple':''}"><div><span class="eyebrow">${copy[0]}</span><h2>${copy[1]}</h2><p>${copy[2]}</p></div><div class="${id==='next'?'pill':'large'}">${copy[3]}</div></article>`}
function deck(i){return `<section class="deck" aria-label="${i?'Right':'Left'} customizable card"><div class="deck-track" data-deck="${i}" tabindex="0" aria-label="Swipe ${i?'right':'left'} card horizontally">${decks[i].map(slide).join('')}</div><div class="deck-footer"><button data-custom="${i}">Customize · ${i?'right':'left'}</button><div class="deck-pager">${decks[i].map((x,j)=>`<button data-goto="${i},${j}" aria-label="Show ${labels[x]} on ${i?'right':'left'} card" class="${j===positions[i]?'active':''}"></button>`).join('')}</div><div class="deck-controls"><button data-card-step="${i},-1" aria-label="Previous ${i?'right':'left'} card">←</button><button data-card-step="${i},1" aria-label="Next ${i?'right':'left'} card">→</button></div></div></section>`}
function timeline(){const d=dataset();let nodes=[];if(layout==='a'){for(const p of d.phases){nodes.push({id:'p'+p.id,title:p.title,phase:p.id,kind:'phase',done:p.items.reduce((s,x)=>s+x.done,0),total:p.items.reduce((s,x)=>s+x.total,0)});if(expanded&&(scope<3||p.id===d.current))nodes.push(...p.items.map(x=>({...x,kind:'deliverable'})))}}else nodes=d.items.map(x=>({...x,kind:'deliverable'}));const active=Math.max(0,nodes.findIndex(x=>x.id===d.active.id||(layout==='a'&&!expanded&&x.phase===d.current)));const minStep=layout==='a'?158:172;const viewport=main.clientWidth-44;const width=Math.max(Math.min(viewport,960),nodes.length*minStep);const step=width/nodes.length;const points=nodes.map((_,i)=>[i*step+20,layout==='c'?44:42+Math.sin(i*1.15)*13]);const path=pts=>pts.map(([x,y],i)=>i?`C${(pts[i-1][0]+x)/2} ${pts[i-1][1]} ${(pts[i-1][0]+x)/2} ${y} ${x} ${y}`:`M${x} ${y}`).join(' ');let groups='';if(layout==='b'){let off=0;for(const p of d.phases){groups+=`<span style="left:${off*step}px;width:${p.items.length*step-18}px">${p.title}</span>`;off+=p.items.length}}const titles={a:'Phases that open into the work.',b:'Deliverables, grouped by phase.',c:'One clear sequence of deliverables.'};const desc={a:'Tap “Show / hide deliverables” to expand the phase nodes on this same timeline.',b:'Phase labels stay above their deliverables. A smaller scope still has a useful journey.',c:'Every dot is a deliverable. Its phase is shown beneath the name.'};return `<article class="journey-card"><div class="journey-head"><div><span class="eyebrow">The project journey · ${d.phases.length} ${d.phases.length===1?'phase':'phases'} in scope</span><h2>${titles[layout]}</h2></div><div class="counter"><b id="journey-count" data-value="${d.done}">1</b><span> / ${d.total}</span><small>applicable tasks complete</small></div></div><div class="journey-controls"><div>${layout==='a'?`<button class="mini-link" data-expand>${expanded?'Hide':'Show'} deliverables ${expanded?'−':'+'}</button>`:`<span class="phase-row-pill">${layout==='b'?'Phases + deliverables':'Deliverables · phase labels'}</span>`}</div><div class="journey-arrows"><button data-replay aria-label="Replay Process animations">↻</button><button data-scroll="-1" aria-label="Earlier work">←</button><button data-scroll="1" aria-label="Later work">→</button></div></div><p class="journey-style-desc">${desc[layout]}</p><div class="rail-scroll" tabindex="0" aria-label="Journey; scroll left and right"><div style="width:${width}px">${groups?`<div class="group-labels">${groups}</div>`:''}<div class="rail" style="width:${width}px"><svg viewBox="0 0 ${width} 95" preserveAspectRatio="none"><path class="base" d="${path(points)}"/><path class="line" pathLength="1000" d="${path(points.slice(0,active+1))}"/></svg>${nodes.map((n,i)=>`<button class="stop motion-node" data-node="${i}" style="--x:${points[i][0]-15}px;--y:${points[i][1]-15}px;width:${step-13}px"><span class="circle motion-dot">${n.kind==='phase'?d.phases.findIndex(p=>p.id===n.phase)+1:'•'}</span><b>${n.title}</b>${layout==='c'?`<span class="phase-note">${phaseNames[n.phase]}</span>`:n.kind==='phase'?'<span class="type-label">Phase</span>':''}<small>${n.done} / ${n.total} tasks</small><span class="tinybar"><i style="width:${n.done/n.total*100}%"></i></span></button>`).join('')}</div></div></div><div class="journey-bottom"><span class="current-label"><i></i>Working on · ${d.active.title}</span><button data-tool="Process">Open Process ↗</button></div></article>`}
let motionNodes=[];function animate(){cancelAnimationFrame(raf);observer?.disconnect();document.querySelectorAll('.firework-overlay').forEach(x=>x.remove());const line=main.querySelector('.line'),nodes=[...main.querySelectorAll('.motion-node')],count=main.querySelector('#journey-count'),value=+count.dataset.value;const length=line.getTotalLength(),end=line.getPointAtLength(length),centers=nodes.map(n=>({x:parseFloat(n.style.getPropertyValue('--x'))+15,y:parseFloat(n.style.getPropertyValue('--y'))+15}));const current=centers.reduce((best,p,i)=>Math.abs(p.x-end.x)<Math.abs(centers[best].x-end.x)?i:best,0);const thresholds=centers.map((p,i)=>{if(i>current)return 2;let lo=0,hi=length;for(let k=0;k<16;k++){const mid=(lo+hi)/2;if(line.getPointAtLength(mid).x<p.x-15)lo=mid;else hi=mid}return length?hi/length:0});const seen=new Set(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let start=null;function frame(now){if(!line.isConnected)return;start??=now;const progress=reduced?1:Math.min(1,(now-start)/Math.max(1300,current*420));count.textContent=value===0?'0':String(progress===1?value:1+Math.floor((value-1)*progress));line.style.strokeDashoffset=1000*(1-progress);nodes.forEach((n,i)=>{const hit=i<=current&&progress>=thresholds[i];n.classList.toggle('reached',hit);n.classList.toggle('active-pulse',i===current&&progress===1);n.querySelector('.tinybar i').style.transform=`scaleX(${progress})`;if(hit&&!seen.has(i)){seen.add(i);const r=n.getBoundingClientRect(),clip=n.closest('.rail-scroll').getBoundingClientRect();if(!reduced&&r.left>=clip.left-20&&r.left<clip.right)motionFireworks(n)}});if(progress<1)raf=requestAnimationFrame(frame)}nodes.forEach(n=>{n.classList.remove('reached','active-pulse');n.querySelector('.tinybar i').style.transform='scaleX(0)'});line.style.strokeDashoffset=1000;count.textContent=value?'1':'0';if(reduced){frame(performance.now());return}observer=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){observer.disconnect();raf=requestAnimationFrame(frame)}},{threshold:.2});observer.observe(line.closest('.journey-card'))}
function render(){document.querySelectorAll('[data-layout]').forEach(b=>b.classList.toggle('active',b.dataset.layout===layout));main.innerHTML=`<div class="top-decks">${deck(0)}${deck(1)}</div><div class="scope-controls"><span>Try a different project scope · all example data</span>${[1,2,8].map(n=>`<button data-scope="${n}" class="${scope===n?'active':''}">${n} ${n===1?'phase':'phases'}</button>`).join('')}<button data-colour class="purple">Preview firework purple</button></div>${timeline()}<p class="sample-note">Mockup controls only. Card choices last while this page is open. Process firework code reused; count-up, line, bars and active pulse replay together. Live Home is unchanged.</p>`;main.querySelectorAll('[data-deck]').forEach(el=>{const i=+el.dataset.deck;el.scrollLeft=positions[i]*el.clientWidth;el.onscroll=()=>{positions[i]=Math.round(el.scrollLeft/el.clientWidth);el.parentElement.querySelectorAll('.deck-pager button').forEach((b,j)=>b.classList.toggle('active',j===positions[i]))};el.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();el.scrollBy({left:el.clientWidth*(e.key==='ArrowRight'?1:-1),behavior:'smooth'})}}});animate()}
function modal(title,body){const d=document.querySelector('#dialog');d.innerHTML=`<header><h2>${title}</h2><button data-close aria-label="Close">×</button></header>${body}`;if(!d.open)d.showModal()}
function customize(which){const indices=which==='both'?[0,1]:[+which];modal('Choose what your Home shows',indices.map(i=>`<section><h3>${i?'Right':'Left'} card · choose cards and order</h3>${[...decks[i],...Object.keys(labels).filter(k=>!decks[i].includes(k))].map(k=>`<div class="edit-row"><label><input type="checkbox" data-choice="${i},${k}" ${decks[i].includes(k)?'checked':''}>${labels[k]}</label>${decks[i].includes(k)?`<button data-order="${i},${k},-1" aria-label="Move ${labels[k]} earlier">↑</button><button data-order="${i},${k},1" aria-label="Move ${labels[k]} later">↓</button>`:''}</div>`).join('')}</section>`).join('')+'<p class="edit-note">Swipe each top card independently or use its arrows. Keep at least one card in each position.</p><button data-apply>Done · preview choices</button>');document.querySelector('#dialog').dataset.which=which}
document.onchange=e=>{if(e.target.dataset.choice){const [i,k]=e.target.dataset.choice.split(',');if(e.target.checked)decks[i].push(k);else if(decks[i].length>1)decks[i].splice(decks[i].indexOf(k),1);else e.target.checked=true;positions[i]=0;customize(document.querySelector('#dialog').dataset.which)}};
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){layout=b.dataset.layout;history.replaceState(null,'','#'+layout);render()}else if(b.dataset.scope){scope=+b.dataset.scope;render()}else if(b.hasAttribute('data-custom'))customize(b.dataset.custom);else if(b.dataset.order){const [i,k,delta]=b.dataset.order.split(','),at=decks[i].indexOf(k),to=Math.max(0,Math.min(decks[i].length-1,at+Number(delta)));decks[i].splice(at,1);decks[i].splice(to,0,k);positions[i]=0;customize(document.querySelector('#dialog').dataset.which)}else if(b.hasAttribute('data-apply')){document.querySelector('#dialog').close();render()}else if(b.hasAttribute('data-close')){document.querySelector('#dialog').close();render()}else if(b.dataset.cardStep||b.dataset.goto){const [i,n]=(b.dataset.cardStep||b.dataset.goto).split(',').map(Number);const el=main.querySelector(`[data-deck="${i}"]`),pos=b.dataset.goto?n:(positions[i]+n+decks[i].length)%decks[i].length;el.scrollTo({left:pos*el.clientWidth,behavior:'smooth'})}else if(b.hasAttribute('data-expand')){expanded=!expanded;render()}else if(b.dataset.scroll){const el=main.querySelector('.rail-scroll');el.scrollBy({left:+b.dataset.scroll*el.clientWidth*.8,behavior:'smooth'})}else if(b.hasAttribute('data-replay'))animate();else if(b.dataset.node!==undefined){modal('Open the work',`<section class="phase-detail"><h2>${b.querySelector('b').textContent}</h2><p>This opens the matching phase or deliverable checklist in Process when built. Editing tasks and assignments stays connected to that same record.</p><button data-close>Back to journey</button></section>`)}else if(b.dataset.image)modal(labels[b.dataset.image],`<div class="photo-stage">${photo(b.dataset.image)}</div>`);else if(b.hasAttribute('data-colour'))modal('Palette-linked fireworks','<p>The production firework uses the Process purple color token. Try a preview color here.</p><label>Purple accent <input type="color" id="purple" value="#aa94cf"></label><button data-palette>Preview and replay</button>');else if(b.hasAttribute('data-palette')){document.documentElement.style.setProperty('--card-purple-strong',document.querySelector('#purple').value);document.querySelector('#dialog').close();animate()}else if(b.hasAttribute('data-studio'))location.href='/reviews/studio-overview-r1/';else if(b.hasAttribute('data-home'))render();else modal(b.dataset.tool||'Project switcher','<p>In the app this opens the existing workspace. This is a separate visual mockup.</p><button data-close>Back</button>')};render();
</script></body></html>
