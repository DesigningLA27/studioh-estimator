function clock(){if(timer&&$('#clock')){let sec=Math.floor((Date.now()-timer.start)/1000);$('#clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}}setInterval(clock,1000);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.adjust)return;let n=get(selected);if(b.dataset.view){variant=b.dataset.view;history.replaceState(null,'','#'+variant);draw()}else if(b.dataset.node){selected=b.dataset.node;draw()}else if(b.dataset.scroll){$('.j-scroll').scrollBy({left:600*Number(b.dataset.scroll),behavior:'smooth'})}else if(b.hasAttribute('data-order')){ordering=!ordering;draw()}else if(b.dataset.move){let i=items.findIndex(x=>x.id===b.dataset.move),j=i+Number(b.dataset.dir);if(items[j]&&items[j].phase===items[i].phase){[items[i],items[j]]=[items[j],items[i]];draw()}}else if(b.hasAttribute('data-complete')){let remaining=n.tasks.filter(t=>!t.done).length;if(remaining)dialog('Complete this deliverable?',`<p>This will check off <b>${remaining} remaining tasks</b> in ${n.title}. No hours will be logged and estimates will stay unchanged.</p>`,'complete','Complete '+remaining+' tasks')}else if(b.hasAttribute('data-pause')){n.paused=!n.paused;draw()}else if(b.hasAttribute('data-current')){current=selected;n.paused=false;draw()}else if(b.dataset.confirm){n.tasks.find(t=>t.id===b.dataset.confirm).confirmed=true;draw()}else if(b.dataset.time){enterTime(b.dataset.time)}else if(b.dataset.timer){if(timer){dialog('A timer is already running',`<p>${esc(timer.label)} is running. Stop and review it first so time is not counted twice.</p>`,'stop-timer','Stop & review')}else{let t=n.tasks.find(t=>t.id===b.dataset.timer);timer={parent:selected,target:b.dataset.timer,label:t?t.name:n.title,start:Date.now()};draw()}}else if(b.hasAttribute('data-stop'))stopTimer();else if(b.hasAttribute('data-close'))$('#modal').close();else if(b.dataset.modalAction==='complete'){undo={id:selected,checks:n.tasks.map(t=>t.done)};n.tasks.forEach(t=>t.done=true);n.paused=false;$('#modal').close();draw()}else if(b.dataset.modalAction==='stop-timer'){$('#modal').close();stopTimer()}else if(b.dataset.modalAction==='save-time'){let h=Number($('#hours').value);if(!Number.isFinite(h)||h<=0){$('#hours').reportValidity();return}let parent=get(timeParent),t=parent.tasks.find(t=>t.id===timeTarget);if(t)t.actual+=h*60;else parent.actual+=h*60;$('#modal').close();draw()}else if(b.hasAttribute('data-undo')&&undo){get(undo.id).tasks.forEach((t,i)=>t.done=undo.checks[i]);undo=null;draw()}});
function stopTimer(){let t=timer;timer=null;draw();enterTime(t.target,Math.max(1,(Date.now()-t.start)/60000),t.parent)}
document.addEventListener('change',e=>{if(e.target.dataset.done){get(selected).tasks.find(t=>t.id===e.target.dataset.done).done=e.target.checked;draw()}});
let hold=null,repeat=null;function adjust(b){let t=get(selected).tasks.find(t=>t.id===b.dataset.adjust);t.estimate=Math.max(0,t.estimate+Number(b.dataset.delta));t.confirmed=false;document.querySelectorAll('[data-value="'+t.id+'"]').forEach(o=>o.textContent=hours(t.estimate))}function release(){clearTimeout(hold);clearInterval(repeat);if(hold){hold=null;draw()}}document.addEventListener('pointerdown',e=>{let b=e.target.closest('[data-adjust]');if(!b)return;e.preventDefault();adjust(b);hold=setTimeout(()=>{repeat=setInterval(()=>adjust(b),100)},450)});document.addEventListener('pointerup',release);document.addEventListener('pointercancel',release);document.addEventListener('keydown',e=>{let b=e.target.closest('[data-adjust]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();adjust(b);draw()}});draw();
</script></body></html>
