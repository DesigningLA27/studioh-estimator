<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio H · Studio & project navigation review</title><style>
:root{--paper:#f3f5ee;--white:#fff;--ink:#233d34;--muted:#667469;--green:#193f35;--sage:#e5edda;--lime:#dff3a6;--purple:#eae3f3;--line:#e4e9df}*{box-sizing:border-box}body{margin:0;background:#e7ece3;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--sage)}button:hover{filter:brightness(.97)}button:focus-visible,input:focus-visible{outline:3px solid #8c75ac;outline-offset:2px}.review{padding:15px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.review b{margin-right:auto}.review small{color:var(--muted)}.review button.active{background:var(--green);color:white}.shell{margin:0 20px 20px;background:white;padding:12px;border-radius:30px;display:grid;grid-template-columns:215px minmax(0,1fr);min-height:calc(100vh - 100px)}aside{background:#f5f7f0;border-radius:23px;padding:22px 14px;display:flex;flex-direction:column;gap:8px}.brand{font-size:22px;font-weight:750;display:flex;gap:9px;align-items:center;padding:0 8px 22px}.logo{background:#55764b;color:white;padding:5px 10px;border-radius:11px}.nav{background:transparent;text-align:left;padding:13px 14px}.nav.on{background:var(--green);color:white}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}aside .eyebrow{margin:16px 12px 3px}.switch{background:white;padding:14px;text-align:left;margin:8px 0}.account{margin-top:auto;padding:15px 10px}.main{padding:16px 24px;background:var(--paper);border-radius:24px;margin-left:12px;min-width:0}.bar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:2px 0 20px;margin-bottom:28px}.bar small{color:var(--muted)}h1{font-size:34px;line-height:1.15;letter-spacing:-1px;margin:8px 0 12px}h2{font-size:22px;letter-spacing:-.5px;line-height:1.25;margin:0 0 14px}h3{font-size:16px;margin:0 0 7px}p{margin:8px 0;color:var(--muted)}.head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.head p{font-size:15px}.pill{display:inline-block;border-radius:99px;padding:6px 11px;background:var(--sage);font-size:11px;white-space:nowrap}.pill.attention{background:var(--purple)}.pill.waiting{background:#f1e9d7}.pill.good{background:var(--sage)}.primary{background:var(--green);color:white}.quiet{background:transparent}.topgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.card{background:white;border-radius:23px;padding:24px;min-width:0}.forest{background:var(--green);color:white}.forest p,.forest .eyebrow{color:#c7d9cc}.forest button{background:var(--lime);color:var(--green)}.lime{background:var(--lime)}.purple{background:var(--purple)}.focus{font-size:27px;line-height:1.2;letter-spacing:-.6px;margin:13px 0;max-width:480px}.focus-row{display:flex;gap:15px;align-items:center;justify-content:space-between;margin-top:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:23px 0 5px}.stats strong{font-size:35px;line-height:1.2;display:block}.stats small{font-size:12px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:27px 0 14px}.sectionhead h2{margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{background:white}.filters button.active{background:var(--green);color:white}input{background:white;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}.tools{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.table{background:white;border-radius:23px;padding:6px 20px;overflow:auto;max-height:490px;overscroll-behavior:contain}.row{display:grid;grid-template-columns:minmax(180px,1.6fr) minmax(120px,1fr) minmax(115px,.9fr) 100px minmax(160px,1.4fr) 32px;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding:17px 0;min-width:800px}.row:last-child{border:0}.row.header{font-size:11px;color:var(--muted);background:white;position:sticky;top:-6px;z-index:1}.row b{font-size:14px}.row small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.projectlink{padding:0;background:none;text-align:left;white-space:normal}.microbar{height:5px;background:var(--paper);border-radius:99px;margin-top:8px;width:80px;overflow:hidden}.microbar i{display:block;height:100%;background:#7e996b;border-radius:99px}.staffrow{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #233d3415}.staffrow:last-child{border:0}.avatar{border-radius:50%;width:34px;height:34px;background:white;display:grid;place-items:center;font-weight:700}.staffrow>div{flex:1}.staffrow small{display:block;color:var(--muted)}.split{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-top:16px}.note{font-size:12px;color:var(--muted);padding:15px 0}.journey{display:flex;gap:10px;overflow:auto;padding:20px 0 9px}.phase{flex:1;min-width:105px}.phase .circle{width:32px;height:32px;border-radius:50%;border:1px solid #94ab98;display:grid;place-items:center;margin-bottom:12px}.phase.done .circle,.phase.now .circle{background:var(--lime);color:var(--green);border-color:var(--lime)}.phase.now .circle{box-shadow:0 0 0 6px #dff3a622}.phase b{font-size:12px;display:block}.phase small{font-size:11px;color:#b9cebd}.healthstrip{display:flex;gap:20px;align-items:center;justify-content:space-between}.healthstrip strong{font-size:30px}.healthstrip small{display:block;color:var(--muted)}.taskrow{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.taskrow>span:nth-child(2){flex:1}.taskrow small{display:block;color:var(--muted);font-size:12px}.check{width:21px;height:21px;border:1px solid #94ab98;border-radius:6px;display:grid;place-items:center;background:white}.overlay{position:fixed;inset:0;background:#17372e55;z-index:10;display:flex;justify-content:flex-end;padding:20px}.drawer{width:min(520px,100%);background:var(--paper);border-radius:27px;padding:26px;overflow:auto;box-shadow:0 10px 55px #122b2230}.drawer header{display:flex;justify-content:space-between;align-items:start;margin-bottom:24px}.drawer .card{margin:15px 0}.switchmodal{width:min(760px,100%);max-height:88vh;background:var(--paper);border-radius:27px;padding:25px;overflow:auto;margin:auto}.switchlist{max-height:420px;overflow:auto}.switchrow{width:100%;display:flex;gap:18px;align-items:center;text-align:left;background:white;padding:15px;margin:8px 0;border-radius:15px}.switchrow>span:first-child{flex:1}.switchrow small{display:block;color:var(--muted)}.modalhead{display:flex;justify-content:space-between;align-items:start}.back{margin-bottom:14px}.drawer .big{font-size:34px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.footer{font-size:11px;color:var(--muted);margin-top:20px}.switchhint{border:1px dashed #a4b29a;border-radius:18px;padding:18px;margin-top:20px}.mobile{display:none}@media(max-width:1000px){.shell{grid-template-columns:170px 1fr}.main{padding:18px}.topgrid,.split{grid-template-columns:1fr}.healthstrip{flex-wrap:wrap}.review{padding:12px}.review small{display:none}}@media(max-width:650px){.shell{margin:0;padding:8px;display:block}aside{display:none}.main{margin:0;padding:14px}.head{align-items:start}h1{font-size:29px}.tools{display:block}.tools input{margin-top:12px;width:100%}.three{grid-template-columns:1fr}.review button{font-size:12px;padding:8px}.review{gap:6px}.review b{width:100%}.mobile{display:block}.overlay{padding:8px}}
</style></head><body><div class="review"><b>Studio H · Navigation & dashboard mockups</b><small>Fictional sample data · live app unchanged</small><button data-view="studio">1 · All projects</button><button data-view="project">2 · One project</button><button data-view="switch">3 · Quick switch</button></div><div class="shell"><aside><div class="brand"><span class="logo">H</span>Studio H</div><span class="eyebrow">Your studio</span><button class="nav" data-view="studio">◫ &nbsp; Studio overview</button><button class="nav" data-team>People & workload</button><button class="switch" data-switch><small>SELECTED PROJECT</small><br><b id="selected-name">San Marino</b> &nbsp;⌄</button><span class="eyebrow">This project</span><button class="nav" data-view="project">Home</button><button class="nav" data-process>Process</button><button class="nav" data-schedule>Schedule</button><button class="nav" data-finance>Financials</button><span class="eyebrow">Across the studio</span><button class="nav" data-info="Proposals">Proposals</button><button class="nav" data-info="Timesheets">Time & timesheets</button><button class="nav" data-info="Libraries">Libraries</button><div class="account"><b>Warwick Hunt</b><br><small>Studio owner</small></div></aside><main class="main" id="main"></main></div><div id="overlay"></div><script>
const names=['San Marino','Oak Ridge','Canyon House','Laurel Court','Pasadena Garden','Seacliff','Cedar Terrace','Montecito','Hillcrest','Palm Court'];const owners=['Maya','Alex','Jordan','Sam'];const statuses=['attention','waiting','good','good','good'];const projects=Array.from({length:50},(_,i)=>({id:i,name:names[i%10]+(i>=10?' · '+(Math.floor(i/10)+1):''),owner:owners[i%4],phase:['Construction Documents','Schematic Design','Programming','Bidding / Negotiation','Construction Observation'][i%5],status:statuses[i%5],hours:80+(i*17)%190,used:35+(i*13)%90,next:['Resolve material approval','Client palette decision','Review base plan','Compare contractor bids','Confirm site visit'][i%5],date:['Oct 20','Oct 22','Oct 23','Oct 26','Oct 28'][i%5]}));projects[0].hours=180;projects[0].used=152;projects.forEach(p=>{if(p.used>p.hours)p.status='attention'});const label={attention:'Needs attention',waiting:'Waiting on client',good:'No flags recorded'};let view='studio',selected=0,filter='all',query='';const main=document.querySelector('#main'),overlay=document.querySelector('#overlay');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pill=p=>`<span class="pill ${p.status}">${label[p.status]}</span>`;function header(scope){return `<div class="bar"><b>${scope}</b><small>Design review · fictional sample</small><button class="mobile" data-switch>Switch project</button></div>`}function counts(){return {attention:projects.filter(p=>p.status==='attention').length,waiting:projects.filter(p=>p.status==='waiting').length}}
function render(){document.querySelectorAll('.review [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelector('#selected-name').textContent=projects[selected].name;document.querySelectorAll('aside [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));if(view==='project')project();else studio();if(view==='switch')switcher()}
function studio(){const c=counts();main.innerHTML=header('Studio overview · all active projects')+`<div class="head"><div><span class="eyebrow">The whole studio, in view</span><h1>Know where you’re needed.</h1><p>Every active project. Start with the exceptions.</p></div><span class="pill">${projects.length} active projects</span></div><div class="topgrid"><article class="card forest"><span class="eyebrow">AI morning brief · example recommendation</span><h2 class="focus">Clear the decisions.<br>Protect the drawing time.</h2><p>San Marino needs a material approval before issue. Oak Ridge is waiting on the client. Review those before adding more work to Maya’s week.</p><div class="focus-row"><button data-brief>Review 3 priorities ↗</button><small>Suggestions for review</small></div></article><article class="card lime"><span class="eyebrow">Where to look first</span><h2 style="margin-top:12px">A manageable shortlist.</h2><div class="stats"><div><strong>${c.attention}</strong><small>need attention</small></div><div><strong>${c.waiting}</strong><small>waiting on clients</small></div><div><strong>2</strong><small>staff over capacity*</small></div></div><p style="font-size:12px">*Illustrative workload scenario. No staff performance judgment.</p></article></div><div class="sectionhead"><h2>Your projects</h2><small>Preview a job without leaving this list</small></div><div class="tools"><div class="filters">${[['all','All 50'],['attention','Needs attention'],['waiting','Waiting'],['mine','Maya’s jobs']].map(([k,t])=>`<button data-filter="${k}" class="${filter===k?'active':''}">${t}</button>`).join('')}</div><input id="search" placeholder="Find a project or person…" aria-label="Find a project" value="${esc(query)}"></div><div class="table"><div class="row header"><span>PROJECT / LEAD</span><span>CURRENT PHASE</span><span>STATUS</span><span>HOURS USED / PLAN</span><span>NEXT STEP / TARGET</span><span></span></div><div id="rows"></div></div><div class="split"><article class="card purple"><div class="sectionhead" style="margin:0 0 12px"><h2>People this week</h2><button data-team>View workload ↗</button></div>${[['Maya',38,32],['Alex',24,32],['Jordan',35,30]].map(([n,h,cap])=>`<div class="staffrow"><span class="avatar">${n[0]}</span><div><b>${n}</b><small>${h} h assigned / ${cap} h available · example</small></div><b>${h>cap?'+'+(h-cap)+' h':'8 h available'}</b></div>`).join('')}</article><article class="card"><span class="eyebrow">Keep the context</span><h2 style="margin-top:12px">One place for every job.</h2><p>Filter the portfolio, preview a project, then open it only when you need to work inside it.</p><button data-switch>Try the project switcher ↗</button></article></div><div class="footer">Mockup: 50 fictional projects. Dates are targets. Hours used do not establish completion or profitability. AI examples are not generated from live data.</div>`;rows();main.querySelector('#search').oninput=e=>{query=e.target.value;rows()}}
function rows(){const list=projects.filter(p=>(filter==='all'||filter==='mine'&&p.owner==='Maya'||p.status===filter)&&`${p.name} ${p.owner}`.toLowerCase().includes(query.toLowerCase()));document.querySelector('#rows').innerHTML=list.map(p=>`<div class="row"><button class="projectlink" data-preview="${p.id}"><b>${esc(p.name)}</b><small>${p.owner} · Preview project ↗</small></button><span>${p.phase}</span><span>${pill(p)}</span><span><b>${p.used} / ${p.hours} h</b><div class="microbar"><i style="width:${Math.min(100,p.used/p.hours*100)}%"></i></div></span><span>${p.next}<small>Target ${p.date}</small></span><button class="quiet" data-open="${p.id}" aria-label="Open ${esc(p.name)}">↗</button></div>`).join('')||'<p>No matching projects.</p>'}
function project(){const p=projects[selected],current={'Programming':1,'Schematic Design':2,'Construction Documents':4,'Bidding / Negotiation':5,'Construction Observation':6}[p.phase]??4;main.innerHTML=header('Project Home · '+esc(p.name))+`<button class="back quiet" data-view="studio">← All projects · return to your filtered list</button><div class="head"><div><span class="eyebrow">One project · ${esc(p.owner)} is project lead</span><h1>${esc(p.name)}</h1><p>${p.phase} · next issue target ${p.date}</p></div>${pill(p)}</div><article class="card forest"><div class="head" style="margin:0"><div><span class="eyebrow">Project journey · existing Process direction retained</span><h2 style="margin-top:8px">From first conversation<br>through project closeout.</h2></div><button data-process>Open Process ↗</button></div><div class="journey">${['Consultation','Programming','Schematic','Development','Documents','Bidding','Observation','Closeout'].map((n,i)=>`<div class="phase ${i<current?'done':i===current?'now':''}"><span class="circle">${i+1}</span><b>${n}</b><small>${i===current?'Current phase':i<current?'Earlier phase':'Upcoming'}</small></div>`).join('')}</div></article><div class="card purple" style="margin-top:16px"><div class="healthstrip"><div><span class="eyebrow">Project health · compact summary</span><h3 style="margin:8px 0">One approval is holding up the issue.</h3><p>Material selection needs a recorded decision.</p></div><div><strong>2</strong><small>earlier tasks open*</small></div><button data-preview="${selected}">Review health ↗</button></div></div><div class="split"><article class="card"><div class="sectionhead" style="margin:0 0 10px"><h2>Next work</h2><button data-process>View checklist ↗</button></div>${['Record material approval','Coordinate consultant comments','Review the issue set'].map((n,i)=>`<div class="taskrow"><span class="check">${i===1?'✓':''}</span><span><b>${n}</b><small>${i===0?'Client decision needed':'Maya · Construction Documents'}</small></span><button class="quiet" data-task="${i}">Open ↗</button></div>`).join('')}</article><article class="card lime"><span class="eyebrow">Protect the fee</span><h2 style="margin-top:12px">Review the effort left.</h2><div class="stats" style="grid-template-columns:1fr 1fr"><div><strong>${p.used}</strong><small>hours recorded</small></div><div><strong>${p.hours}</strong><small>planned hours</small></div></div><button data-finance style="margin-top:18px">Review Financials ↗</button></article></div><div class="footer">*Illustrative single-project screen. This is a placement concept, not a proposal to replace the existing project imagery or Home design. Current journey shown for the example project.</div>`}
function panel(title,body){overlay.innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><div><span class="eyebrow">Preview · keep your place</span><h2 style="margin-top:8px">${title}</h2></div><button data-close aria-label="Close preview">×</button></header>${body}</section></div>`;overlay.querySelector('[data-close]').focus()}
function preview(id){const p=projects[id];panel(esc(p.name),`${pill(p)}<p>${p.phase} · ${p.owner}</p><article class="card"><span class="eyebrow">Next action</span><h2 style="margin-top:12px">${p.next}</h2><p>Target ${p.date}. Review the source task before changing the plan.</p><button data-open="${id}" class="primary">Open this project ↗</button></article><article class="card purple"><h3>Why it needs your attention</h3><p>${p.status==='attention'?'Example: a required decision is missing before the next issue.':p.status==='waiting'?'Example: the next step needs a response from the client.':'No exception is flagged in this fictional record. That does not prove the project is on schedule.'}</p><button data-evidence>View source & assumptions</button></article><article class="card"><div class="three"><div><b class="big">${p.used}</b><p>hours used</p></div><div><b class="big">${p.hours}</b><p>hours planned</p></div></div><p>Remaining effort needs review. No profit or finish-date forecast is inferred from these figures.</p></article><p>Close this panel to return to the same portfolio filter and scroll position.</p>`)}
function switcher(){overlay.innerHTML=`<div class="overlay"><section class="switchmodal" role="dialog" aria-modal="true" aria-label="Switch project"><div class="modalhead"><div><span class="eyebrow">All jobs, always within reach</span><h2 style="margin-top:7px">Where do you want to work?</h2></div><button data-close aria-label="Close switcher">×</button></div><input id="switchsearch" placeholder="Search 50 projects or a project lead…" aria-label="Search all projects" style="width:100%"><button data-view="studio" style="width:100%;text-align:left;margin:12px 0;background:var(--green);color:white">◫ &nbsp; Studio overview · all 50 projects ↗</button><span class="eyebrow" id="switchlabel">Pinned & recent · example</span><div class="switchlist" id="switchlist"></div><div class="switchhint"><b>Always know your context.</b><p>The studio overview never changes when you select a project. The project name stays visible in the sidebar and page heading.</p></div></section></div>`;const input=overlay.querySelector('#switchsearch');const draw=()=>{const q=input.value.toLowerCase(),list=q?projects.filter(p=>`${p.name} ${p.owner}`.toLowerCase().includes(q)):projects.slice(0,7);overlay.querySelector('#switchlabel').textContent=q?`${list.length} matching projects`:'Pinned & recent · example';overlay.querySelector('#switchlist').innerHTML=list.map(p=>`<button class="switchrow" data-open="${p.id}"><span><b>${esc(p.name)}</b><small>${p.phase} · ${p.owner}</small></span>${pill(p)}<span>↗</span></button>`).join('')||'<p>No matching projects.</p>'};input.oninput=draw;draw();input.focus()}
function brief(){panel('Three decisions for today',`<span class="pill">AI example · not live analysis</span>${[['1','San Marino','Review the missing material approval before the issue set.','Source: incomplete approval task + issue target.'],['2','Oak Ridge','Follow up on the client’s palette decision.','Source: waiting-on-client status.'],['3','Maya’s week','Review 6 hours above planned availability.','Source: 38 assigned hours against 32 available.']].map(([i,t,r,s])=>`<article class="card"><span class="pill">Priority ${i}</span><h2 style="margin-top:12px">${t}</h2><p>${r}</p><small>${s}</small><p><button ${i==='3'?'data-team':'data-preview="'+(Number(i)-1)+'"'}>Review before acting ↗</button></p></article>`).join('')}<p>No schedules, assignments, fees or messages change automatically.</p>`)}
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){overlay.innerHTML='';view=b.dataset.view;render()}else if(b.hasAttribute('data-close'))overlay.innerHTML='';else if(b.hasAttribute('data-switch'))switcher();else if(b.dataset.filter){filter=b.dataset.filter;studio()}else if(b.dataset.preview!==undefined)preview(Number(b.dataset.preview));else if(b.dataset.open!==undefined){selected=Number(b.dataset.open);overlay.innerHTML='';view='project';render()}else if(b.hasAttribute('data-brief'))brief();else if(b.hasAttribute('data-team'))panel('People & workload',`<p>Across all active jobs · illustrative week</p>${[['Maya',38,32],['Alex',24,32],['Jordan',35,30],['Sam',20,32]].map(([n,h,c])=>`<article class="card"><h2>${n}</h2><b class="big">${h} / ${c} h</b><p>Assigned effort / available time</p><p>${h>c?'Review the workload with this person before moving commitments.':'Capacity may be available; confirm skills and project dependencies.'}</p></article>`).join('')}<p>Assess commitments and support needed. Do not infer a person’s performance from time logged alone.</p>`);else if(b.hasAttribute('data-evidence'))panel('Evidence & assumptions','<article class="card"><h2>Make the reasoning visible.</h2><p>In the built app, this opens the saved task, dependency, due date and latest remaining-effort review behind the recommendation.</p><p>These mockups use fictional examples only.</p></article>');else panel(b.dataset.info||'Open the existing workspace','<article class="card"><h2>Keep the tools you already use.</h2><p>This link would open the existing tool for the selected project. This review does not edit the live application.</p></article>')};document.onkeydown=e=>{if(e.key==='Escape')overlay.innerHTML=''};render();
</script></body></html>
