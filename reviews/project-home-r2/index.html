0">Swipe left or right to see all phases. The current phase stays in view on opening.</p>':''}</article>`}

function modal(title,body){const d=document.querySelector('#dialog');d.innerHTML=`<header><h2>${title}</h2><button data-close aria-label="Close">×</button></header>${body}`;if(!d.open)d.showModal()}
function showPhoto(){modal(['Garden reference','Material palette','Outdoor furniture'][photo],`<div class="photo-stage">${image(photo)}</div><div style="display:flex;justify-content:space-between;margin-top:15px"><button data-photo-step="-1">← Previous</button><small>Project image ${photo+1} of 3 · sample references</small><button data-photo-step="1">Next →</button></div>`)}
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){layout=b.dataset.layout;history.replaceState(null,'','#'+layout);render()}else if(b.dataset.mode){mode=b.dataset.mode;render()}else if(b.dataset.scroll){const r=main.querySelector('.rail-scroll');r.scrollBy({left:Number(b.dataset.scroll)*r.clientWidth*.75,behavior:'smooth'})}else if(b.dataset.phase!==undefined){const n=(mode==='phases'?phases:deliverables)[Number(b.dataset.phase)];modal(n[0],`<section class="phase-detail"><span class="pill">${n[2]?`${n[1]} of ${n[2]} tasks complete`:'Optional phase · not in scope'}</span><p>This opens the existing Process checklist for this ${mode==='phases'?'phase':'deliverable'} when implemented.</p><p>The journey is a quick way into the work. Editing tasks, time and assignments stays in Process.</p><button data-close>Back to Home</button></section>`)}else if(b.dataset.photo!==undefined){photo=Number(b.dataset.photo);showPhoto()}else if(b.dataset.photoStep){photo=(photo+Number(b.dataset.photoStep)+3)%3;showPhoto()}else if(b.hasAttribute('data-close'))document.querySelector('#dialog').close();else if(b.hasAttribute('data-studio'))location.href='/reviews/studio-overview-r1/';else if(b.hasAttribute('data-home'))render();else if(b.hasAttribute('data-detail'))modal('The next move',`<section class="phase-detail"><span class="pill">Example · Needs a decision</span><h2 style="margin-top:16px">Record material approval.</h2><p>Confirm the palette with the client before issuing the coordinated drawing set.</p><p>Maya · Construction Documents</p><button data-tool="Process">Open in Process ↗</button></section>`);else modal(b.dataset.tool||'Switch project',`<section class="phase-detail"><p>This would open the existing ${b.dataset.tool||'project switcher'} for the selected project. The live application is unchanged.</p><button data-close>Return to mockup</button></section>`)};render();
</script></body></html>
