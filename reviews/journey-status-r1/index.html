olute;inset:-2px;width:48px;height:48px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3;stroke:#91aa8860}.ring .value{stroke:#dff3a6;stroke-linecap:round}.ring.overdue .value{stroke:#f0988f}.ring.waiting .value{stroke:#c6b5df}body[data-option=b] .j-node:not(.complete) .j-circle{border-color:transparent;font-size:13px}body[data-option=b] .j-bar{display:none}body[data-option=c] .j-status{padding:6px 9px;border-radius:15px;background:#ffffff15;font-weight:650;color:#e0e9df}body[data-option=c] .complete .j-status{background:#dff3a6;color:#193f35}body[data-option=c] .overdue .j-status{background:#f0988f;color:#193f35}body[data-option=c] .waiting .j-status{background:#c6b5df;color:#193f35}body[data-option=c] .current .j-status{background:#c6b5df;color:#193f35}body[data-option=c] .j-track{height:272px}body[data-option=c] .j-circle{width:36px;height:36px;margin-top:6px;margin-bottom:6px;font-size:16px}.review button.active{background:#193f35;color:white}@keyframes travel{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes focusPulse{50%{box-shadow:0 0 0 9px #b79bd911,0 0 25px #b79bd950}}@media(prefers-reduced-motion:reduce){.j-sweep,.j-node.current .j-circle{animation:none}}@media(max-width:800px){.explanation{grid-template-columns:1fr}.status-note{flex-direction:column}.task-rows{grid-template-columns:1fr}.j-heading h2{font-size:21px}}
</style></head><body><div class="review"><b>Journey · Completion and sequence</b><small>Interactive mockups · fictional task data</small><button data-option="a">A · Clear circles</button><button data-option="b">B · Progress rings</button><button data-option="c">C · Status labels</button></div><div class="shell"><aside><div class="brand"><span class="logo">H</span>Studio H</div><span class="eyebrow">Your studio</span><button class="nav" data-studio>Studio overview ↗</button><button class="switch" data-project><small>SELECTED PROJECT</small><br><b>Sample — San Marino</b> ⌄</button><span class="eyebrow">This project</span><button class="nav on" data-home>Home</button><button class="nav" data-tool="Setup">Setup</button><button class="nav" data-tool="Process">Process</button><button class="nav" data-tool="Schedule">Schedule</button><button class="nav" data-tool="Design">Design</button><button class="nav" data-tool="Financials">Financials</button><button class="nav" data-tool="Files">Files</button><span class="eyebrow">Across the studio</span><button class="nav" data-tool="Time & timesheets">Time & timesheets</button><button class="nav" data-tool="Proposals">Proposals</button><button class="nav" data-tool="Libraries">Libraries</button><div class="account"><b>Warwick Hunt</b><br><small>Studio owner</small></div></aside><main class="main"><div class="status-intro"><span class="eyebrow">Sample — San Marino</span><h1>Progress you can trust.</h1><p>Same journey. Completion comes from the work, independently of timeline order.</p></div><div id="review-content"></div></main></div><script>
const initial=[{title:'Revised preliminary estimate',phase:'Programming & Site Analysis',done:9,total:9},{title:'Concept plan',phase:'Schematic Design',done:5,total:14},{title:'Cost estimate updated',phase:'Schematic Design',done:1,total:5,overdue:true},{title:'Planting concept',phase:'Schematic Design',done:2,total:9,waiting:true},{title:'Materials specified',phase:'Schematic Design',done:10,total:10},{title:'Layout & dimensions',phase:'Construction Documents',done:2,total:8},{title:'Lighting plan',phase:'Construction Documents',done:6,total:6},{title:'Issue set',phase:'Construction Documents',done:0,total:4}];let data=initial.map(n=>({...n,checks:Array.from({length:n.total},(_,i)=>i<n.done)})),current=5,selected=1,option=['a','b','c'].includes(location.hash.slice(1))?location.hash.slice(1):'a';const descriptions={a:['Clear circles','Recommended: filled checkmarks mean complete. Hollow circles mean work remains. The halo means current.'],b:['Progress rings','Each ring shows the actual task fraction. A checkmark appears only when every applicable task is done.'],c:['Status labels','Explicit labels make earlier unfinished work, overdue tasks, waiting, and finished work easy to distinguish.']};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(replay=true){const old=document.querySelector('.j-scroll')?.scrollLeft||0;document.body.dataset.option=option;document.querySelectorAll('[data-option]').forEach(b=>b.classList.toggle('active',b.dataset.option===option));const n=data[selected],complete=n.checks.every(Boolean),done=data.reduce((s,x)=>s+x.checks.filter(Boolean).length,0),total=data.reduce((s,x)=>s+x.total,0);document.querySelector('#review-content').innerHTML=`<div class="status-note"><b>${option.toUpperCase()} · ${descriptions[option][0]}</b><span>${descriptions[option][1]}</span></div><section class="journey-card"><div class="j-heading"><div><span class="eyebrow">THE PROJECT JOURNEY</span><h2>Sample — San Marino</h2></div><div class="j-total"><strong>${done}</strong> / ${total}<small>applicable tasks complete</small></div></div><div class="j-tools"><span class="pill">Deliverables · grouped by phase</span><div><button data-replay>↻ Replay</button><button data-scroll="-1" aria-label="Earlier deliverables">←</button><button data-scroll="1" aria-label="Later deliverables">→</button></div></div><div class="j-scroll" tabindex="0" aria-label="Scroll journey horizontally"><div class="j-track"><div class="j-phase" style="left:2px;width:166px">Programming</div><div class="j-phase" style="left:182px;width:706px">Schematic Design</div><div class="j-phase" style="left:902px;width:526px">Construction Documents</div><div class="j-line"></div><div class="j-sweep" style="width:${current*180}px;${replay?'':'animation:none'}"></div>${data.map((x,i)=>{const count=x.checks.filter(Boolean).length,isDone=count===x.total,cls=isDone?'complete':x.overdue?'overdue':x.waiting?'waiting':'';const state=isDone?(i>current?'Complete · ahead':'Complete'):i===current?'Current · '+(x.total-count)+' left':x.overdue?'Overdue · '+(x.total-count)+' left':x.waiting?'Waiting on client':i<current?(x.total-count)+' tasks left behind':count?'In progress':'Not started';return `<button data-node="${i}" class="j-node ${cls} ${i===current?'current':''}" style="left:${i*180+2}px" aria-label="${x.title}: ${count} of ${x.total} tasks. ${state}"><span class="j-circle">${option==='b'&&!isDone?`<svg class="ring ${cls}" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21"/><circle class="value" cx="24" cy="24" r="21" pathLength="100" stroke-dasharray="${count/x.total*100} 100"/></svg>${count}/${x.total}`:isDone?'✓':x.overdue?'!':x.waiting?'Ⅱ':''}</span><b>${x.title}</b><small>${count} / ${x.total} tasks</small><span class="j-bar"><i style="width:${count/x.total*100}%"></i></span><span class="j-status">${state}</span></button>`}).join('')}</div></div><div class="j-legend"><span><i class="key done"></i>Complete</span><span><i class="key"></i>Unfinished</span><span><i class="key current"></i>Current focus</span><span><i class="key overdue"></i>Overdue / blocked</span></div><div class="j-foot"><span>Working on · <b>${data[current].title}</b></span><span>Line = sequence, not completion</span></div></section><div class="explanation"><article><h3>5 / 14 is unfinished.</h3><p>Concept plan stays open even though you have moved into Construction Documents.</p></article><article><h3>Finished ahead? Still finished.</h3><p>Lighting plan has all six tasks complete. It gets a checkmark even though it sits after the current deliverable.</p></article><article><h3>Red means attention.</h3><p>The overdue estimate uses coral. Ordinary remaining tasks stay neutral, avoiding a page full of alarms.</p></article></div><section class="task-demo"><header><div><span class="eyebrow">TRY THE STATUS RULES</span><h2>${n.title}</h2></div><span class="pill">${n.checks.filter(Boolean).length} / ${n.total} tasks</span></header><p>Choose any timeline item, then complete or reopen its example tasks. Its position never decides its status.</p><div class="demo-actions"><button data-focus class="pill-current">Make this my current focus</button><button data-all>${complete?'Reopen one task':'Complete remaining tasks'}</button><button data-reset>Reset example</button></div><div class="task-rows">${n.checks.map((v,i)=>`<label><input type="checkbox" data-task="${i}" ${v?'checked':''}>${esc((selected===1?['Review client priorities','Confirm site constraints','Draw preferred layout','Check circulation','Review draft internally','Develop alternate arrangement','Coordinate pool position','Check setbacks','Prepare presentation plan','Review with client','Resolve comments','Update estimate','Record approval','Issue approved concept']:[])[i]||'Example task '+(i+1))}</label>`).join('')}</div></section>`;document.querySelector('.j-scroll').scrollLeft=old}
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.option){option=b.dataset.option;history.replaceState(null,'','#'+option);draw()}else if(b.dataset.node!==undefined){selected=+b.dataset.node;draw(false)}else if(b.dataset.scroll)document.querySelector('.j-scroll').scrollBy({left:+b.dataset.scroll*650,behavior:'smooth'});else if(b.hasAttribute('data-replay'))draw();else if(b.hasAttribute('data-focus')){current=selected;draw()}else if(b.hasAttribute('data-all')){const n=data[selected];if(n.checks.every(Boolean))n.checks[n.total-1]=false;else n.checks.fill(true);draw(false)}else if(b.hasAttribute('data-reset')){data=initial.map(n=>({...n,checks:Array.from({length:n.total},(_,i)=>i<n.done)}));current=5;selected=1;draw()} };document.onchange=e=>{if(e.target.dataset.task!==undefined){data[selected].checks[+e.target.dataset.task]=e.target.checked;draw(false)}};draw();
</script></body></html>
